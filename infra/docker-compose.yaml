# Jalankan dari root repo:  docker compose -f infra/docker-compose.yaml up --build
services:
  redis:
  image: redis:7-alpine
  restart: always
  volumes:
    - redis_data:/data
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5

  api:
    build:
      context: .. # root repo, supaya models/ ikut terjangkau
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../apps/api/.env
    environment:
      - REDIS_HOST=redis
      - APP_ENV=development
    depends_on:
      - redis
    restart: unless-stopped
