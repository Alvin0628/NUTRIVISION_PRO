name: API CI/CD

on:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "infra/docker-compose.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-3
  ECR_REPOSITORY: nutrivision-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f apps/api/Dockerfile -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-southeast-3 | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}
            cd ~/nutrivision_pro/infra
            docker compose pull api
            docker compose up -d
