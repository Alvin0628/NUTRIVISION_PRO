name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
  push:
    branches: [develop]
    paths:
      - "apps/web/**"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run build
